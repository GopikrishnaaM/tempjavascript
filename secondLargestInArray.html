    <script>

       function secondLargest(arr) 
    {

        for (let i = 0; i < arr.length; i++) 
        {
            for (let j = 0; j < arr.length - 1 - i; j++) 
            {
                if (arr[j] > arr[j + 1]) 
                {
                    let temp = arr[j];
                    arr[j] = arr[j + 1];
                    arr[j + 1] = temp;
                }
            }
        }
        return arr[arr.length - 2];
    }


    console.log(secondLargest([5, 2, 1, 8]));
    </script>
