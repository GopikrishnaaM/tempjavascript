<body>
    
    <script>
        function largestNumber(a)
        {
            let largest = a[0];
            for (let i = 1; i < a.length; i++)
            {
                if (a[i] > largest)
                {
                    largest = a[i];
                }
                // else
                // {
                //     continue;
                // }
            }
            return largest;
        }
      console.log(largestNumber([44, 23, 12, 2, 34])); // Output: 5
    </script>
</body>
