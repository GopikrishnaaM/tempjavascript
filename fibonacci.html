    <script>

        function fibonacci(n)
        {
            let a = 0;
            let b = 1;
            let result;

            for (let i = 0; i < n ; i++)
            {
                console.log(a);
                result = a + b;
                a = b;
                b = result;
            }
        }
    fibonacci(10);
