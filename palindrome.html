<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        function palindrome(pstr)
        {
            let reversed = "";
            for (let i = pstr.length - 1; i >= 0; i--)
            {
                reversed += pstr[i];
            }
            
            if (pstr == reversed)
            {
                console.log(pstr + " is a palindrome");
            }
            else
            {
                console.log(pstr + " is not a palindrome");
            }
        }
        console.log(palindrome("racecar"));
    </script>
</body>
</html>
