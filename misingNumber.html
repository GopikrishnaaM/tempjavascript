<body>
    
    <script>

    function missingNumber(arr, n) 
    {
        let total = n * (n + 1) / 2;
        let sum = 0;
    
        for (let i = 0; i < arr.length; i++) 
        {
            sum = sum + arr[i];
        }
        return total - sum;
    }

    console.log(missingNumber([1, 2, 3, 4, 6], 6));
    </script>
</body>
