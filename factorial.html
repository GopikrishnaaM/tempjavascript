        function factorial(x)
        {
            let arr = [];
            let result = 1;

            for (let i = 1; i <= x; i++)
            {
                arr[i - 1] = i;
            }

            for (let j = 0; j < arr.length; j++)
            {
                result = result * arr[j];
            }
            return result;
        }
        console.log(factorial(12));
