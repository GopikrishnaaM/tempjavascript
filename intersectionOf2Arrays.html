<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        function intersectionOf2Arrays(arr1, arr2) {
            let result = [];
            for (let i = 0; i < arr1.length; i++) {
                for (let j = 0; j < arr2.length; j++) {
                    if (arr1[i] === arr2[j]) {
                        result[result.length] = arr1[i];
                        break;
                    }
                }
            }
            return result;
        }

        console.log(intersectionOf2Arrays([1, 2, 3, 4], [3, 4, 5, 6]));
    </script>
</body>
</html>
