<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

    function firstLetterUpperCase(str) 
    {
        let result = "";
        let capitalize = true;

        for (let i = 0; i < str.length; i++) 
        {
            if (capitalize && str[i] !== " ") 
            {
                let ch = str[i];
                result = result + ch.toUpperCase();
                capitalize = false;
            } 
            else 
            {
                result = result + str[i];
            }
            if (str[i] === " ")
            {
                capitalize = true;
            }
        }

        return result;
    }

    console.log(firstLetterUpperCase("hello world javascript"));
    </script>
</body>
</html>
