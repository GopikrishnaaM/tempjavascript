<!DOCTYPE html>

<body>
    
    <script>

        function smallestNumber(a)
        {
            let smallest = a[0];
            for (let i = 1; i < a.length; i++)
            {
                if (a[i] < smallest)
                {
                    smallest = a[i];
                }
            }
            return smallest;
        }
        console.log(smallestNumber([44, 23, 12, 2, 34]));
    </script>
</body>
