<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        function add(a, b)
        {
            return a + b;
        }

        function subtract(a, b)
        {
            return a - b;
        }

        function multiply(a, b)
        {
            return a * b;
        }

        function divide(a, b)
        {
            if (b === 0)
            {
                return "Error: Division by zero is not allowed.";
            }
            return a / b;
        }

        function calculate(a, b, operator)
        {
            switch (operator)
            {
                case '+':
                    return add(a, b);
                case '-':
                    return subtract(a, b);
                case '*':
                    return multiply(a, b);
                case '/':
                    return divide(a, b);
                default:
                    return "Error: Invalid operator.";
            }
        }

        console.log(calculate(10, 5, '+'));
    </script>
</body>
</html>
