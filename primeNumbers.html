<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        function prime(n)
        {
            let isPrime = true;

            if (n <= 1) 
            {
                isPrime = false;
            } 
            else 
            {
                for (let i = 2; i < n; i++) 
                {
                    if (n % i === 0) 
                    {
                        isPrime = false;
                        break;
                    }
                }
            }
            if (isPrime) 
            {
                console.log(n + " is a prime number.");
            } 
            else 
            {
                console.log(n + " is not a prime number.");
            }
        }

        console.log(prime(5));
    </script>
</body>
</html>
